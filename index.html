:root{--bg:#0b0614;--txt:#e4dbf5;--mute:#b9acd6;--dim:#8a7aa8;--pink:#ff2d7a;--pink2:#ff79b0;--cyan:#29e3ff;--gold:#ffd34d;--violet:#8b5cff;--glass:rgba(22,10,40,.78);--line:rgba(255,255,255,.13);--beat:.5s;color-scheme:dark}

body{margin:0;background:var(--bg);color:var(--txt);font:15.5px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;overflow-x:hidden}

a{color:var(--pink2)}
img,video{max-width:100%}

.capmode .hero{min-height:860px}.capmode .rv{opacity:1;transform:none}   /* ?shot 시안 캡처용 (긴 창에서 첫 화면이 창 높이만큼 늘어나지 않게) — 이름이 .shot(게임 화면 카드)과 겹쳐 페이지가 220px로 줄었었음 */
@media(prefers-reduced-motion:reduce){.logo,.store:after,.streaks i,.cue:after{animation:none}.rv{opacity:1;transform:none;transition:none}}

document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>setLang(c.dataset.lang));
// 화면에 들어온 영상만 재생 (데이터 아끼기)
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting){v.dataset.on="1";if(!v.getAttribute("src"))v.src=v.dataset.src;v.play().catch(()=>{})}else{delete v.dataset.on;v.pause()}}),{threshold:.35});
document.querySelectorAll("video[data-v]").forEach(v=>io.observe(v));
const rv=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");rv.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll(".rv").forEach(e=>rv.observe(e));
const topBar=document.getElementById("top");addEventListener("scroll",()=>topBar.classList.toggle("solid",scrollY>60),{passive:true});   // 'top'은 브라우저가 이미 쓰는 이름이라 스크립트 전체가 멈췄음
